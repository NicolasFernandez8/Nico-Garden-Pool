name: Verificar consulta de prospectos
on:
  push:
    paths: ['.github/scripts/check-overpass.mjs', '.github/workflows/check-overpass.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/check-overpass.mjs
